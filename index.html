<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="meUus — Human Development, Intelligence & Execution OS. Claim ≤ Evidence. Operates online and offline." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/jpeg" href="/founder-a01.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>meUus | Universal Operating System for Human Development</title>
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[meUus PWA] ServiceWorker registered with scope:', reg.scope))
            .catch(err => console.warn('[meUus PWA] ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
